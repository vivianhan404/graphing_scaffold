<!DOCTYPE html>
<html>
  <head>
    <title>My experiment</title>
    <script src="html2canvas.js"></script>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    <script src="jspsych/plugin-html-button-response.js"></script>
    <script src="jspsych/plugin-image-button-response.js"></script>
    <script src="jspsych/plugin-audio-button-response.js"></script>
    <script src="jspsych/plugin-video-button-response.js"></script>
    <script src="jspsych/plugin-graph-scaffold.js"></script>
    <script src='https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js'></script>
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
  </head>
  <body></body>
  <script>
    const debug = true;
    const BASEDIR = "https://vivhan.scripts.mit.edu/graphing_scaffold/";
    
    const jsPsych = initJsPsych();
    const searchParams = new URLSearchParams(window.location.search);
    const FILE_NAME = searchParams.get('c') + "-" + searchParams.get('r');
    
    const isScaffold = jsPsych.randomization.sampleBernoulli(0.5);
    jsPsych.data.addProperties({'order': (isScaffold)? "scaffold": "control"});
    
    // UTIL ====================================================================
    
    // functions
    const img = (filename) => BASEDIR + `img/${filename}.png`;
    const mp3 = (filename) => BASEDIR + `mp3/${filename}.mp3`;
    const mp4 = (filename) => BASEDIR + `mp4/${filename}.mp4`;
    const get_version = (filename) => filename + ((isScaffold)? '_scaffold': '_jumbled');

    function write_data_to_server(filename, filedata) {
      /*
      This function sends a data packet to the specified URL as a POST request.
      The specified URL is for a PHP script that writes the POST request's
      contents (`filename` and `filedata`) to a file on the server.
      */
      const url_write_data_php = BASEDIR + "write_data.php";
      jQuery.ajax({
        type: 'post',
        cache: false,
        url: url_write_data_php,
        data: {
          filename: "data/" + filename + ".json",
          filedata: filedata,
        },
      });
    }

    const next_html = (choice, choice_index) => 
      `<button class="jspsych-btn"><img src="${BASEDIR + "img/next.png"}" height="50px"/></button>`

    // trial templates
    const make_video_trial = (filename) => ({
      type: jsPsychVideoButtonResponse,
      stimulus: [mp4(filename)],
      height: 400,
      choices: ["NEXT"],
      button_html: next_html,
      response_allowed_while_playing: debug,
    });

    const scaffold_base = {
      type: jsPsychGraphScaffold,
      button_img: img('next'),
      input_required: !debug,
      response_allowed_while_playing: debug,
      allow_click: debug,

      prompt: "<p>How tall is the tree on day 5?</p>",
      audio: mp3('tree_day_5'),
    };
    const pic = { input_type: "grow" };
    const bar = { dynamic_height: 300, input_type: "rise" };
    const dot = { input_type: "click", initial_height: 0 };
    const match = { audio: mp3('tree_match'), prompt: "Match the height of the tree!" };

    function make_least_most (img_name, prompt) {
      const make_clickable_columns = (choice, choice_index) => {
        let position = `z-index: 10;`;
        if (choice_index === 0) position += `margin-left: 55px;`;

        return 
          `<button class="jspsych-btn" 
            key=${choice_index} 
            style="
              ${position} 
              height: 310px; width: 165px; 
              background-color: transparent;"
          />`;
      };
      
      return {
        type: jsPsychAudioButtonResponse,
        stimulus_height: 365,
        button_layout: "flex",
        button_html: make_clickable_columns,
        prompt: `<div>
          <img src=${img(img_name)} style="height: 365px; margin-top: -315px"/>
          <p>${prompt}</p></div>`,
      };
    };

    const warning = {
      type: jsPsychHtmlButtonResponse,
      stimulus: "<h1>This study requires a larger screen size. Please log in on another device.</h1>",
      choices: ['next'],
      button_html: (c, ci) => "<button hidden />",
    }
    if (window.innerHeight < 650 || window.innerWidth < 900) {
      jsPsych.run([warning]);
      throw new Error("window is not large enough");
    }
    

    // STIMULI ====================================================================
    
    const preload = {
      type: jsPsychPreload,
      auto_preload: true
    };
    const intro = [
      {
        type: jsPsychHtmlButtonResponse,
        stimulus: "<h1>Fun with Graphing!</h1>",
        choices: ['NEXT'],
        button_html: next_html,
      },
      make_video_trial('intro'),
    ];
    const outro = [
      { // TODO done renamed to transition_{last idx}
        ...make_video_trial('done.mp4'),
        on_start: () => write_data_to_server(FILE_NAME, jsPsych.data.get().json())
      },
      {
        type: jsPsychHtmlButtonResponse,
        stimulus: "<h1>Press the green button under this window to complete the study.</h1>",
        choices: ['next'],
        button_html: (choice, choice_index) => '<button hidden />'
      }
    ];

    // 1a
    const tree_tutorial = make_video_trial('1a_tree_tutorial');
    const tree_match = {
      ...scaffold_base, ...pic, ...match,
      static_image:   img('1a_tree_match'),
      dynamic_image:  img('1a_tree_single'),
    };
    const tree_explain = make_video_trial(get_version('1a_tree_intro'));
    const tree_graph = {
      ...scaffold_base, ...pic,
      static_image:   img('1a_tree_graph'),
      dynamic_image:  img('1a_tree_single'),
    };
    
    // 1b
    const trunk_explain = make_video_trial(get_version('1b_trunk_intro'));
    const trunk_graph = {
      ...scaffold_base, ...bar,
      static_image:   img('1b_trunk_graph'),
      dynamic_image:  img('1b_trunk_single'),
    };

    // 1c
    const dot_tutorial = make_video_trial('1c_dot_tutorial');
    const dot_match = {
      ...scaffold_base, ...dot, ...match,
      static_image:   img('1c_dot_match'),
      dynamic_image:  img('1b_dot_single'),
    };
    const dot_explain = make_video_trial(get_version('1c_dot_intro'));
    const dot_graph = {
      ...scaffold_base, ...dot,
      static_image:   img('1c_dot_graph'),
      dynamic_image:  img('1b_dot_single'),
    };

    // 2
    const alien_tree = {
      ...scaffold_base, ...pic,
      static_image:   img('2_alien_tree_graph'),
      dynamic_image:  img('2_alien_tree_single'),
      audio: mp3(get_version('2_alien_tree')),
      initial_height: 280,
    };
    const alien_dot = {
      ...scaffold_base, ...dot,
      static_image:   img('2_alien_dot_graph'),
      dynamic_image:  img('2_alien_dot_single'),
      audio: mp3(get_version('2_alien_dot'))
    };
    const alien_v = {
      ...scaffold_base, ...dot,
      static_image:   img('2_alien_v_graph'),
      dynamic_image:  img('2_alien_v_single'),
      audio:  mp3(get_version('2_alien_v')),
      prompt: "<p>How tall is the tree on day 11?</p>",
      input_width: 125,
    };

    // 3
    const fruit_explain = make_video_trial(get_version('3_fruit_intro'));
    const fruit_graph_1 = {
      ...scaffold_base, ...dot,
      static_image:   img('3_fruit_graph_1'),
      dynamic_image:  img('3_fruit_single'),
      audio:          mp3('3_fruit_graph_1'),
      prompt: "<p>How many fruits were picked on day 4?</p>",
      input_margin_right: 180,
    };
    const fruit_graph_2 = {
      ...scaffold_base, ...dot,
      static_image:   img('3_fruit_graph_2'),
      dynamic_image:  img('3_fruit_single'),
      audio:          mp3('3_fruit_graph_2'),
      prompt: "<p>How many fruits were picked on day 5?</p>",
    };

    //4
    const toy_explain = make_video_trial(get_version('4_toy_intro'));
    const toy_least = {
      ...make_least_most('4_toy_graph', 'What month did the least toys get sold?'),
      stimulus: mp3('4_toy_least'),
      choices: ['oct', 'nov', 'dec', 'jan', 'feb'],
    };
    const toy_most = {
      ...make_least_most('4_toy_graph', 'What month did the most toys get sold?'),
      stimulus: mp3('4_toy_most'),
      choices: ['oct', 'nov', 'dec', 'jan', 'feb'],
    };
    const toy_why = make_video_trial('4_toy_why');
    toy_why.prompt = 'Why do you think the most number of toys sold that month? Answer out loud!';
    
    //5
    const icecream_explain = make_video_trial(get_version('5_icecream_intro'));
    const icecream_least = {
      ...make_least_most('5_icecream_graph', 'What month did the least ice cream get sold?'),
      stimulus: mp3('5_icecream_least'),
      choices: ['mar', 'apr', 'may', 'jun', 'jul'],
    };
    const icecream_most = {
      ...make_least_most('5_icecream_graph', 'What month did the most ice cream get sold?'),
      stimulus: mp3('5_icecream_most'),
      choices: ['mar', 'apr', 'may', 'jun', 'jul'],
    };
    const icecream_why = make_video_trial('5_icecream_why');
    icecream_why.prompt = 'Why do you think the most ice cream was sold that month? Answer out loud!';

    const tree_pic = [[tree_tutorial, tree_match], [tree_explain, tree_graph]];
    const tree_trunk = [[trunk_explain, trunk_graph]];
    const tree_dot = [[dot_tutorial, dot_match], [dot_explain, dot_graph]];
    const alien = [[alien_tree], [alien_dot], [alien_v]];
    const fruit = [[fruit_explain, fruit_graph_1, fruit_graph_2]];
    const toy = [[toy_explain, toy_least], [toy_most], [toy_why]];
    const icecream = [[icecream_explain, icecream_least], [icecream_most], [icecream_why]];
    
    const content_steps = (isScaffold)
      ? [].concat( tree_pic, tree_trunk, tree_dot, alien, fruit, toy, icecream )
      : [].concat( tree_dot, tree_trunk, tree_pic, [alien_v], icecream, [alien_dot], [alien_tree], toy, fruit );
    const transition_name = (isScaffold)? 'scaffold': 'jumbled';
    const content_trials = content_steps.map((step, idx) => [
      step,
      make_video_trial(`${transition_name}_${idx}`)
    ]);

    const all_trials = [preload, intro, content_trials, outro].flat();
    jsPsych.run(all_trials);

  </script>
</html>
